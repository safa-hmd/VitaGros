name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_PREFIX: vitagros   # images : ghcr.io/<owner>/vitagros-user, ...

jobs:
  # ---------- CI : services Spring Boot ----------
  backend-java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - Eureka
          - config-server
          - gateway
          - Microservices/user
          - Microservices/produit
          - Microservices/commande
          - Microservices/paiement
          - Microservices/livraison
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build (compilation + package)
        working-directory: Backend/${{ matrix.path }}
        run: mvn -B -ntp verify -DskipTests

  # ---------- CI : microservice IA (Python) ----------
  recommandation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/Microservices/recommandation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/Microservices/recommandation/requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest

  # ---------- CI : frontend Angular ----------
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ---------- CD : build + push des images vers GitHub Container Registry ----------
  docker:
    needs: [backend-java, recommandation, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # nécessaire pour pousser vers ghcr.io avec GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: eureka,         context: Backend/Eureka }
          - { name: config-server,  context: Backend/config-server }
          - { name: gateway,        context: Backend/gateway }
          - { name: user,           context: Backend/Microservices/user }
          - { name: produit,        context: Backend/Microservices/produit }
          - { name: commande,       context: Backend/Microservices/commande }
          - { name: paiement,       context: Backend/Microservices/paiement }
          - { name: livraison,      context: Backend/Microservices/livraison }
          - { name: recommandation, context: Backend/Microservices/recommandation }
          - { name: frontend,       context: Frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/vitagros-<service> (mis en minuscules automatiquement)
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}