<div class="page-container">
  <div class="page-header">
    <div>
      <h1 class="page-title">🛒 Commandes</h1>
      <p class="page-subtitle">Suivi et gestion des commandes</p>
    </div>
    <button class="btn-primary" (click)="openForm()">+ Nouvelle commande</button>
  </div>

  <div class="alert alert-error" *ngIf="error()">⚠️ {{ error() }}</div>

  <div class="form-panel card" *ngIf="showForm()">
    <h3 class="card-title">{{ editId() ? 'Modifier' : 'Nouvelle' }} commande</h3>
    <form (ngSubmit)="save()" class="grid-form">
      <div class="field-group">
        <label>ID Utilisateur</label>
        <input type="number" [(ngModel)]="form.userId" name="userId" placeholder="ID" required />
      </div>
      <div class="field-group">
        <label>Date</label>
        <input type="date" [(ngModel)]="form.orderDate" name="orderDate" required />
      </div>
      <div class="field-group">
        <label>Statut</label>
        <select [(ngModel)]="form.status" name="status">
          <option value="PENDING">En attente</option>
          <option value="CONFIRMED">Confirmée</option>
          <option value="SHIPPED">Expédiée</option>
          <option value="DELIVERED">Livrée</option>
          <option value="CANCELLED">Annulée</option>
        </select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-primary">{{ editId() ? '💾 Modifier' : '➕ Ajouter' }}</button>
        <button type="button" class="btn-secondary" (click)="reset()">Annuler</button>
      </div>
    </form>
  </div>

  <div class="card table-card">
    <div class="table-header">
      <span class="table-count">{{ orders().length }} commande(s)</span>
      <input type="text" class="search-input" [(ngModel)]="search" placeholder="🔍 Rechercher par statut…" />
    </div>
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr><th>#</th><th>User ID</th><th>Date</th><th>Statut</th><th>Actions</th></tr>
        </thead>
        <tbody>
          <tr *ngFor="let o of filtered()" class="table-row">
            <td><span class="id-badge">{{ o.id }}</span></td>
            <td>{{ o.userId }}</td>
            <td>{{ o.orderDate }}</td>
            <td><span class="status-badge" [class]="'status-' + (o.status ? o.status.toLowerCase() : '')">{{ o.status }}</span></td>
            <td class="actions-cell">
              <button class="btn-icon btn-edit" (click)="edit(o)">✏️</button>
              <button class="btn-icon btn-delete" (click)="remove(o.id!)">🗑️</button>
            </td>
          </tr>
          <tr *ngIf="filtered().length === 0">
            <td colspan="5" class="empty-row">Aucune commande.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
